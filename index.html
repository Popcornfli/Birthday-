<h1>🎂 Countdown to Pri's Birthday</h1><div id='cd'></div>
<script>
const target=new Date('2026-08-08T00:00:00');
setInterval(()=>{let d=target-new Date();if(d<0){cd.innerHTML='Happy Birthday!';return;}
let days=Math.floor(d/86400000);cd.innerHTML=days+' days';},1000);
</script>
